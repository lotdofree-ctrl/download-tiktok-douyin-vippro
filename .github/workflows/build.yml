name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK with Stacktrace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Set up JDK 17 (Required for modern Gradle & Android Gradle Plugin)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 2. Grant executable permissions to gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 3. Setup Gradle caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      # 4. Build APK (assembleDebug produces an installable test APK without keystore secrets)
      - name: Build APK with Stacktrace
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # 5. Upload APK artifact so you can download it directly from GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
